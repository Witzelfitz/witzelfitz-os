---
# Baut das Image taeglich (neue Bazzite-Basis, Kernel, Nvidia) und bei jedem
# Push, laedt es nach ghcr.io/witzelfitz/witzelfitz-os und signiert es mit cosign.
# Grundlage: ublue-os/image-template, ohne Justfile und ohne Rechunk.
name: Image bauen
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 6 * * *'  # taeglich 06:30 UTC, nach dem Bazzite-Build
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/witzelfitz
  IMAGE_NAME: witzelfitz-os

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Skripte pruefen
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Shell und Setup pruefen
        run: |
          shellcheck make-iso.sh test-iso.sh build_files/*.sh system_files/usr/bin/witzelfitz-setup tools/*.sh
          python3 -m unittest discover -s tests -p test_setup.py -v
          python3 -m unittest discover -s tests -p test_activation.py -v
      - name: PowerShell-Syntax pruefen
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/build-windows.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

  build_push:
    needs: checks
    name: Image bauen und veroeffentlichen
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Platz schaffen
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Image bauen
        run: |
          set -euo pipefail
          sudo podman build --pull=newer --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:latest" -f Containerfile .

      - name: Signaturschluessel pruefen
        run: cmp cosign.pub system_files/etc/pki/containers/witzelfitz-os.pub

      - name: Image pruefen
        run: |
          set -euo pipefail
          sudo podman run --rm "${IMAGE_NAME}:latest" \
            rpm -q patch tmux fzf ripgrep fd-find bat zoxide git-delta direnv btop neovim python3-dbus python3-gobject python3-pyside6
          python3 build_files/public-assets.py --root system_files
          sudo podman run --rm --network=none -e QT_QPA_PLATFORM=offscreen \
            -v "$PWD:/repo:ro,z" -w /repo "${IMAGE_NAME}:latest" \
            python3 -m unittest discover -s tests -v
          sudo podman run --rm "${IMAGE_NAME}:latest" test -x /usr/bin/witzelfitz-setup
          sudo podman run --rm "${IMAGE_NAME}:latest" test -x /usr/bin/witzelfitz-desktop
          sudo podman run --rm "${IMAGE_NAME}:latest" test -x /usr/bin/witzelfitz-scenes
          sudo podman run --rm "${IMAGE_NAME}:latest" python3 /usr/bin/witzelfitz-desktop validate
          sudo podman run --rm --network=none \
            -v "$PWD/build_files/public-assets.py:/check-public-assets.py:ro,z" \
            "${IMAGE_NAME}:latest" python3 /check-public-assets.py --root / --check
          sudo podman run --rm -e QT_QPA_PLATFORM=offscreen "${IMAGE_NAME}:latest" python3 /usr/bin/witzelfitz-scenes --screenshot /tmp/scenes.png
          sudo podman run --rm -v "$PWD/tools/check-boot-image.sh:/check-boot-image.sh:ro,z" \
            "${IMAGE_NAME}:latest" bash /check-boot-image.sh
          sudo podman run --rm "${IMAGE_NAME}:latest" \
            sh -c 'test -f /usr/lib/modules/*/extra/facer/facer.ko'
          sudo podman run --rm "${IMAGE_NAME}:latest" \
            jq -e '.transports.docker["ghcr.io/witzelfitz/witzelfitz-os"]' /etc/containers/policy.json

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            sudo podman login --authfile "$RUNNER_TEMP/registry-auth.json" ghcr.io -u "${{ github.actor }}" --password-stdin

      # Erst einen eindeutigen Kandidaten hochladen. Öffentliche Update-Tags
      # bleiben unverändert, bis dessen Signatur erfolgreich geprüft wurde.
      - name: Kandidat nach GHCR laden
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          CANDIDATE="${IMAGE_REGISTRY}/${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo podman push --authfile "$RUNNER_TEMP/registry-auth.json" --digestfile=/tmp/digestfile "${IMAGE_NAME}:latest" "$CANDIDATE"
          echo "digest=$(cat /tmp/digestfile)" >> "${GITHUB_OUTPUT}"

      - name: Cosign installieren
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Image signieren
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" |
            cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # altes Bundle-Format, damit rpm-ostree/bootc die Signatur lesen kann
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Registry-Werkzeug bereitstellen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi

      - name: Signatur pruefen und Update-Tags veroeffentlichen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
        run: |
          set -euo pipefail
          REF="${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          cosign verify --key cosign.pub "$REF"
          VERSION=$(sudo podman inspect "${IMAGE_NAME}:latest" \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
          TAGS="$(date -u +%Y%m%d) sha-${GITHUB_SHA}"
          [ -z "$VERSION" ] || TAGS="$TAGS $VERSION"
          # latest zuletzt setzen. Alle Tags zeigen auf den bereits signierten Digest.
          for tag in $TAGS latest; do
            sudo skopeo copy --authfile "$RUNNER_TEMP/registry-auth.json" --all --preserve-digests "docker://$REF" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:$tag"
          done
          {
            echo "### Veröffentlichtes System-Image"
            echo "- Revision: ${GITHUB_SHA}"
            echo "- Digest: ${DIGEST}"
            echo "- Signatur geprüft; latest folgt diesem Digest."
          } >> "${GITHUB_STEP_SUMMARY}"
